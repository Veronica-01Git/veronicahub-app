name: Gera e publica matéria (Wire TV)

on:
  # Uma matéria por hora, com editoria rotativa calculada pelo endpoint. Quem
  # dá o ritmo é o Cron Trigger do Cloudflare, no Worker `wire-tv-cron`
  # (`workers/wire-cron/`), que manda `workflow_dispatch` de hora em hora.
  # Publicado em 13/09; a primeira virada saiu às 18:00:05 UTC, cinco segundos
  # depois da hora cheia.
  #
  # O `schedule` daqui deixou de ser o gatilho e virou rede de segurança, uma
  # vez por dia. Não dá para confiar nele como principal: o agendador do GitHub
  # é best-effort e descarta disparo. Medido neste repositório com `:17`/`:47`
  # (48 disparos/dia esperados): 9 rodadas em 11/09, 15 em 12/09, 6 em 13/09 —
  # nenhuma no minuto pedido, sempre 4 a 27 min atrasada, com buracos de 4h48 e
  # 5h15. Passar para `*/15` não melhorou nada: das 15:57 às 18:00 de 13/09
  # foram oito janelas seguidas sem um único disparo.
  #
  # Por que uma rodada diária em vez de remover de vez: o token que o Worker
  # usa é fine-grained e vence. Quando vencer, o Worker para em silêncio, sem
  # erro em nenhum lugar que se olhe no dia a dia. Esta rodada custa no máximo
  # uma chamada de IA por dia e faz a falha aparecer como ausência de matéria
  # nova em vez de sumiço despercebido.
  #
  # Fora do minuto 0 de propósito: o Worker dispara em :00 e o `concurrency`
  # abaixo enfileira em vez de cancelar, então coincidir só criaria espera.
  schedule:
    - cron: "30 11 * * *"
  # Mudanças no próprio pipeline disparam uma rodada de validação. O filtro
  # impede que commits de capas criem um ciclo de novas publicações.
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-article.yml"
  workflow_dispatch: {}

concurrency:
  group: veronica-wire-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Chama o endpoint de geração automática
        id: generate
        run: |
          # Em pushes deste workflow, dê tempo ao Cloudflare para servir o
          # código recém-mergeado antes da rodada automática de validação.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Aguardando o deploy do Worker..."
            sleep 45
          fi

          status=$(curl --silent --show-error \
            --max-time 120 \
            -o response.json -w "%{http_code}" \
            -X POST "https://veronicahub.com/api/cron/generate-article" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            # Anotação de erro com o corpo da resposta: aparece na aba Actions
            # e na API pública de check-runs, sem precisar baixar o log. Foi o
            # que faltou em 26/09, quando o Wire ficou 20h falhando sem que o
            # motivo aparecesse em lugar nenhum de fácil acesso.
            echo "::error title=Geração da matéria falhou (HTTP $status)::$(head -c 900 response.json | tr '\n\r' '  ')"
            exit 1
          fi
          if [ "$(jq -r '.skipped == true' response.json)" = "true" ]; then
            reason=$(jq -r '.error // "rodada editorial sem publicação"' response.json)
            {
              echo "### Wire TV — rodada sem publicação"
              echo
              echo "- Motivo: $reason"
              echo "- Editoria processada: $(jq -r '.beat // "não informada"' response.json)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "generated=$(jq -r '.ok == true and (.skipped != true)' response.json)"
            echo "slug<<COVER_EOF"
            jq -r '.slug' response.json
            echo "COVER_EOF"
            echo "headline<<COVER_EOF"
            jq -r '.headline' response.json
            echo "COVER_EOF"
            echo "excerpt<<COVER_EOF"
            jq -r '.excerpt // ""' response.json
            echo "COVER_EOF"
            echo "beat<<COVER_EOF"
            jq -r '.beat' response.json
            echo "COVER_EOF"
            echo "desk<<COVER_EOF"
            jq -r '.desk' response.json
            echo "COVER_EOF"
            echo "fotoTermos<<COVER_EOF"
            jq -c '.fotoTermos // []' response.json
            echo "COVER_EOF"
            echo "recentPhotoIds<<COVER_EOF"
            jq -c '.recentPhotoIds // []' response.json
            echo "COVER_EOF"
            echo "libraryCoverId<<COVER_EOF"
            jq -r '.libraryCoverId // ""' response.json
            echo "COVER_EOF"
            echo "libraryCoverTerm<<COVER_EOF"
            jq -r '.libraryCoverTerm // ""' response.json
            echo "COVER_EOF"
            echo "libraryCoverRelevante<<COVER_EOF"
            jq -r '.libraryCoverRelevante // false' response.json
            echo "COVER_EOF"
            echo "libraryCoverCredit<<COVER_EOF"
            jq -r '.libraryCoverCredit // ""' response.json
            echo "COVER_EOF"
          } >> "$GITHUB_OUTPUT"

      # A partir daqui é tudo capa de imagem — best-effort. A matéria já foi
      # publicada no passo acima; se qualquer coisa daqui pra frente falhar,
      # ela simplesmente fica sem capa (coverImageUrl null), como já acontecia
      # antes desse workflow existir. Por isso cada passo checa o resultado do
      # anterior via `if:` em vez de deixar o job inteiro falhar.
      - name: Checkout do repositório
        if: steps.generate.outputs.generated == 'true'
        id: checkout
        uses: actions/checkout@v4

      # Nível 1 (26/09): foto ÚNICA da matéria, buscada no Pexels (principal)
      # e no Pixabay (reserva) — ver o cabeçalho de scripts/fetch-cover-live.mjs.
      #
      # Substituiu o banco curado da biblioteca, que tinha ~1 foto por cena e
      # repetia a mesma imagem em matérias diferentes (27 das 30 capas da home
      # em 26/09). A lição de 13/09 (Telangana com rua americana) continua
      # valendo e está no script: a cena curada vai primeiro, foto que diz ser
      # de outro lugar é recusada, e nenhuma foto já publicada volta — nem pelo
      # id, nem pela aparência.
      #
      # Os ids usados ficam em scripts/data/wire-fotos-usadas.json, commitado
      # junto com a capa no passo "Commita a capa".
      - name: Busca capa única (Pexels → Pixabay)
        if: steps.checkout.outcome == 'success'
        id: fetch_photo
        continue-on-error: true
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
          COVER_BEAT: ${{ steps.generate.outputs.beat }}
          COVER_HEADLINE: ${{ steps.generate.outputs.headline }}
          COVER_EXCERPT: ${{ steps.generate.outputs.excerpt }}
          COVER_FOTO_TERMOS: ${{ steps.generate.outputs.fotoTermos }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          # O hash visual usa o ImageMagick; o passo de otimização mais abaixo
          # também, e o apt não reinstala o que já está lá.
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          node scripts/fetch-cover-live.mjs > photo-result.json
          cat photo-result.json
          path=$(jq -r '.path // empty' photo-result.json)
          if [ -n "$path" ]; then found=true; else found=false; fi
          {
            echo "found=$found"
            echo "photoId<<COVER_EOF"
            jq -r '.photoId // empty' photo-result.json
            echo "COVER_EOF"
            echo "photoCredit<<COVER_EOF"
            jq -r '.photoCredit // empty' photo-result.json
            echo "COVER_EOF"
            echo "photoUrl<<COVER_EOF"
            jq -r '.photoUrl // empty' photo-result.json
            echo "COVER_EOF"
          } >> "$GITHUB_OUTPUT"

      # O canvas serve dois passos — a arte de capa e o card do Instagram —,
      # então é instalado uma vez só, antes dos dois. Fora do package.json de
      # propósito: é binário nativo pesado que só o runner usa, mesmo padrão
      # que o Playwright seguia aqui.
      - name: Instala o canvas (sem tocar no package.json)
        if: steps.checkout.outcome == 'success'
        id: install_canvas
        continue-on-error: true
        run: npm install --no-save --no-package-lock @napi-rs/canvas

      # Nível 2 (novo em 20/09): ilustração gerada pela Nano Banana Pro, para
      # quando o banco curado não tinha fotografia para a editoria. Fica
      # DEPOIS do banco de propósito — fotografia real de cena real é sempre
      # preferível a imagem inventada — e ANTES da arte tipográfica, que
      # continua sendo o piso que nunca falha.
      #
      # A imagem sai creditada como "Ilustração gerada por IA (Nano Banana
      # Pro)" pelo próprio script, e esse crédito atravessa até o rodapé da
      # capa e a legenda do Instagram. Publicar ilustração sintética sem essa
      # marca seria pior que o erro de 13/09: lá a foto era de outro lugar
      # real, aqui a cena não existiu em lugar nenhum.
      #
      # continue-on-error: sem HF_CREDENTIALS, sem crédito na conta ou com a
      # API fora, o script imprime {} e a cascata segue para a arte do slug.
      - name: Gera ilustração de capa (Nano Banana Pro)
        if: steps.checkout.outcome == 'success' && steps.fetch_photo.outputs.found != 'true'
        id: generate_cover
        continue-on-error: true
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
          COVER_BEAT: ${{ steps.generate.outputs.beat }}
          COVER_SCENE: ${{ steps.generate.outputs.libraryCoverTerm }}
          HF_CREDENTIALS: ${{ secrets.HF_CREDENTIALS }}
        run: |
          node scripts/generate-cover-image.mjs > generated-cover.json
          cat generated-cover.json
          path=$(jq -r '.path // empty' generated-cover.json)
          if [ -n "$path" ]; then found=true; else found=false; fi
          {
            echo "found=$found"
            echo "photoCredit<<COVER_EOF"
            jq -r '.photoCredit // empty' generated-cover.json
            echo "COVER_EOF"
          } >> "$GITHUB_OUTPUT"

      # Nível 3: arte própria da matéria, gerada do hash do slug. Substituiu,
      # em 15/09, a foto fixa por editoria (que dava a mesma imagem a toda
      # matéria da editoria) e o card tipográfico via Playwright (que baixava
      # um Chromium a cada rodada para desenhar sempre o mesmo layout).
      #
      # É o piso: não depende de chave de API nem de rede, então é o que
      # garante que nenhuma matéria fique sem capa.
      - name: Gera a arte de capa da matéria
        if: steps.install_canvas.outcome == 'success' && steps.fetch_photo.outputs.found != 'true' && steps.generate_cover.outputs.found != 'true'
        id: render
        continue-on-error: true
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
          COVER_BEAT: ${{ steps.generate.outputs.beat }}
        run: node scripts/render-cover-art.mjs

      # Para a foto do banco (que chega no tamanho e no peso que o fotógrafo
      # mandou) e para a ilustração da Nano Banana Pro (que sai em 1536 px e
      # bem mais pesada que a caixa da capa precisa). A arte tipográfica do
      # slug fica de fora: já sai em 1200×630 com ~60 KB, e o 4:2:0 do
      # otimizador borraria as linhas finas da composição.
      - name: Otimiza a capa para alta resolução e baixo peso
        if: steps.fetch_photo.outputs.found == 'true' || steps.generate_cover.outputs.found == 'true'
        continue-on-error: true
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          bash scripts/optimize-cover.sh "public/images/blog-covers/${COVER_SLUG}.jpg"

      # Card do feed do Instagram, gerado junto com a capa em vez de depender
      # de alguém abrir a matéria e clicar em compartilhar. Mesmo traçado do
      # botão de /blog/$slug (ambos usam src/lib/wire-instagram-card.ts), então
      # não existem dois cards diferentes. Sai como asset do site, em
      # /images/instagram/, para quem vai postar só abrir o endereço e baixar.
      #
      # continue-on-error porque isto é material de divulgação: se falhar, a
      # matéria continua publicada e com capa, e o botão da página segue como
      # caminho manual.
      - name: Gera o card do Instagram
        if: steps.fetch_photo.outputs.found == 'true' || steps.generate_cover.outputs.found == 'true' || steps.render.outcome == 'success'
        id: instagram_card
        continue-on-error: true
        env:
          WIRE_SLUG: ${{ steps.generate.outputs.slug }}
          WIRE_HEADLINE: ${{ steps.generate.outputs.headline }}
          WIRE_EXCERPT: ${{ steps.generate.outputs.excerpt }}
          WIRE_BEAT: ${{ steps.generate.outputs.beat }}
          WIRE_PHOTO_CREDIT: ${{ steps.fetch_photo.outputs.photoCredit || steps.generate_cover.outputs.photoCredit }}
          WIRE_OUT_DIR: public/images/instagram
        run: node scripts/render-instagram-card.mjs

      - name: Commita a capa no repositório
        if: steps.fetch_photo.outputs.found == 'true' || steps.generate_cover.outputs.found == 'true' || steps.render.outcome == 'success'
        id: commit
        continue-on-error: true
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/images/blog-covers/${COVER_SLUG}.jpg"
          # Registro das fotos já usadas: é o que impede a próxima matéria de
          # repetir esta foto.
          if [ -f scripts/data/wire-fotos-usadas.json ]; then git add scripts/data/wire-fotos-usadas.json; fi
          # O card e a legenda entram no MESMO commit da capa: um commit a
          # mais no main significa um deploy a mais, e cada deploy troca o que
          # a produção está servindo. Se o passo anterior falhou, os arquivos
          # não existem e o commit segue só com a capa.
          for extra in "public/images/instagram/wire-tv-${COVER_SLUG}.jpg" "public/images/instagram/wire-tv-${COVER_SLUG}.txt"; do
            if [ -f "$extra" ]; then git add "$extra"; fi
          done
          git commit -m "chore(wire): capa automática — ${COVER_SLUG}"
          # Outra conversa/automação pode atualizar main enquanto a foto é
          # baixada. Rebaseia o commit único da capa antes de enviar, evitando
          # perder a imagem por um non-fast-forward transitório.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Espera o deploy publicar o asset
        if: steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
        run: |
          url="https://veronicahub.com/images/blog-covers/${COVER_SLUG}.jpg"
          for _ in $(seq 1 8); do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" "$url")
            if [ "$status" = "200" ]; then
              echo "Asset já está no ar ($url)."
              break
            fi
            echo "Ainda não ($status) — aguardando o deploy..."
            sleep 10
          done

      - name: Seta coverImageUrl da matéria
        if: steps.commit.outcome == 'success'
        id: set_cover
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
          PHOTO_ID: ${{ steps.fetch_photo.outputs.photoId }}
          PHOTO_CREDIT: ${{ steps.fetch_photo.outputs.photoCredit || steps.generate_cover.outputs.photoCredit }}
          PHOTO_URL: ${{ steps.fetch_photo.outputs.photoUrl }}
        run: |
          url="https://veronicahub.com/images/blog-covers/${COVER_SLUG}.jpg"
          body=$(jq -n \
            --arg slug "$COVER_SLUG" \
            --arg url "$url" \
            --arg photoId "$PHOTO_ID" \
            --arg photoCredit "$PHOTO_CREDIT" \
            --arg photoUrl "$PHOTO_URL" \
            '{slug: $slug, coverImageUrl: $url, photoId: $photoId, photoCredit: $photoCredit, photoUrl: $photoUrl}')
          status=$(curl --silent --show-error \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            -o set-cover-response.json -w "%{http_code}" \
            -X POST "https://veronicahub.com/api/cron/set-cover-image" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$body")
          echo "HTTP status: $status"
          cat set-cover-response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Registro da capa falhou (HTTP $status)::$(head -c 900 set-cover-response.json | tr '\n\r' '  ')"
            exit 1
          fi

      # Best-effort e com trava dupla: o Worker só publica quando
      # META_INSTAGRAM_AUTOPUBLISH=true e procura a URL canônica nos posts
      # recentes antes de criar outro. Uma falha na Meta não derruba a matéria.
      - name: Publica a matéria no Instagram da Wire TV
        if: steps.set_cover.outcome == 'success' && steps.instagram_card.outcome == 'success'
        continue-on-error: true
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
        run: |
          image_url="https://veronicahub.com/images/instagram/wire-tv-${COVER_SLUG}.jpg"
          body=$(jq -n \
            --arg slug "$COVER_SLUG" \
            --arg imageUrl "$image_url" \
            '{slug: $slug, imageUrl: $imageUrl}')
          status=$(curl --silent --show-error \
            --max-time 60 \
            --retry 2 \
            --retry-all-errors \
            -o instagram-response.json -w "%{http_code}" \
            -X POST "https://veronicahub.com/api/cron/publish-instagram" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$body")
          echo "HTTP status: $status"
          cat instagram-response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

      - name: Sincroniza capas publicadas com a biblioteca Admin
        if: steps.generate.outputs.generated == 'true'
        continue-on-error: true
        run: |
          status=$(curl --silent --show-error \
            --max-time 120 \
            --retry 2 \
            --retry-all-errors \
            -o library-response.json -w "%{http_code}" \
            -X POST "https://veronicahub.com/api/cron/backfill-wire-covers" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat library-response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
