name: Gera e publica matéria (Veronica Wire)

on:
  # Minuto 17 evita a maior fila do GitHub Actions no início da hora. O
  # pipeline usa Groq no Worker, radar GDELT/RSS/Google News e uma trava
  # mecânica de 72h para a data do fato; Anthropic não é necessário.
  schedule:
    - cron: "17 * * * *"
    # Segunda oportunidade na mesma hora. Se a primeira rodada publicar, a
    # trava por janela evita nova chamada à IA e impede duplicatas.
    - cron: "47 * * * *"
  # Mudanças no próprio pipeline disparam uma rodada de validação. O filtro
  # impede que commits de capas criem um ciclo de novas publicações.
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-article.yml"
  workflow_dispatch: {}

concurrency:
  group: veronica-wire-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Chama o endpoint de geração automática
        id: generate
        run: |
          # Em pushes deste workflow, dê tempo ao Cloudflare para servir o
          # código recém-mergeado antes da rodada automática de validação.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Aguardando o deploy do Worker..."
            sleep 45
          fi

          status=$(curl --silent --show-error \
            --max-time 120 \
            -o response.json -w "%{http_code}" \
            -X POST "https://veronicahub.com/api/cron/generate-article" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
          if [ "$(jq -r '.skipped == true' response.json)" = "true" ]; then
            reason=$(jq -r '.error // "rodada editorial sem publicação"' response.json)
            {
              echo "### Veronica Wire — rodada sem publicação"
              echo
              echo "- Motivo: $reason"
              echo "- Editoria: $(jq -r '.beat // "não informada"' response.json)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "generated=$(jq -r '.ok == true and (.skipped != true)' response.json)"
            echo "slug<<COVER_EOF"
            jq -r '.slug' response.json
            echo "COVER_EOF"
            echo "headline<<COVER_EOF"
            jq -r '.headline' response.json
            echo "COVER_EOF"
            echo "beat<<COVER_EOF"
            jq -r '.beat' response.json
            echo "COVER_EOF"
            echo "desk<<COVER_EOF"
            jq -r '.desk' response.json
            echo "COVER_EOF"
            echo "fotoTermos<<COVER_EOF"
            jq -c '.fotoTermos // []' response.json
            echo "COVER_EOF"
            echo "recentPhotoIds<<COVER_EOF"
            jq -c '.recentPhotoIds // []' response.json
            echo "COVER_EOF"
          } >> "$GITHUB_OUTPUT"

      # A partir daqui é tudo capa de imagem — best-effort. A matéria já foi
      # publicada no passo acima; se qualquer coisa daqui pra frente falhar,
      # ela simplesmente fica sem capa (coverImageUrl null), como já acontecia
      # antes desse workflow existir. Por isso cada passo checa o resultado do
      # anterior via `if:` em vez de deixar o job inteiro falhar.
      - name: Checkout do repositório
        if: steps.generate.outputs.generated == 'true'
        id: checkout
        uses: actions/checkout@v4

      # Nível 1/2/3 da cadeia de fallback: Pexels, depois Pixabay, depois
      # foto genérica fixa por editoria (se já foi commitada em
      # public/images/blog-covers/_fallback/<beat>.jpg). PEXELS_API_KEY e
      # PIXABAY_API_KEY vazios (secret não cadastrado ainda) fazem esse
      # passo não achar nada e cair pro card tipográfico — nunca falha o job.
      - name: Busca foto real (Pexels/Pixabay/fallback fixo)
        if: steps.checkout.outcome == 'success'
        id: fetch_photo
        continue-on-error: true
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
          COVER_BEAT: ${{ steps.generate.outputs.beat }}
          COVER_FOTO_TERMOS: ${{ steps.generate.outputs.fotoTermos }}
          COVER_RECENT_PHOTO_IDS: ${{ steps.generate.outputs.recentPhotoIds }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          node scripts/fetch-cover-photo.mjs > photo-result.json
          cat photo-result.json
          path=$(jq -r '.path // empty' photo-result.json)
          if [ -n "$path" ]; then found=true; else found=false; fi
          {
            echo "found=$found"
            echo "photoId<<COVER_EOF"
            jq -r '.photoId // empty' photo-result.json
            echo "COVER_EOF"
            echo "photoCredit<<COVER_EOF"
            jq -r '.photoCredit // empty' photo-result.json
            echo "COVER_EOF"
            echo "photoUrl<<COVER_EOF"
            jq -r '.photoUrl // empty' photo-result.json
            echo "COVER_EOF"
          } >> "$GITHUB_OUTPUT"

      # Nível 4 (último recurso): card tipográfico, só quando nada acima
      # encontrou uma foto de verdade.
      - name: Instala o Playwright (sem tocar no package.json)
        if: steps.fetch_photo.outcome == 'success' && steps.fetch_photo.outputs.found != 'true'
        id: install_pw
        continue-on-error: true
        run: npm install --no-save playwright

      - name: Instala o Chromium do Playwright
        if: steps.install_pw.outcome == 'success'
        id: install_chromium
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Renderiza o card de capa (HTML/CSS -> jpg)
        if: steps.install_chromium.outcome == 'success'
        id: render
        continue-on-error: true
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
          COVER_HEADLINE: ${{ steps.generate.outputs.headline }}
          COVER_BEAT: ${{ steps.generate.outputs.beat }}
          COVER_DESK: ${{ steps.generate.outputs.desk }}
        run: node scripts/render-cover.mjs

      - name: Otimiza a capa para alta resolução e baixo peso
        if: steps.fetch_photo.outputs.found == 'true' || steps.render.outcome == 'success'
        continue-on-error: true
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          bash scripts/optimize-cover.sh "public/images/blog-covers/${COVER_SLUG}.jpg"

      - name: Commita a capa no repositório
        if: steps.fetch_photo.outputs.found == 'true' || steps.render.outcome == 'success'
        id: commit
        continue-on-error: true
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/images/blog-covers/${COVER_SLUG}.jpg"
          git commit -m "chore(wire): capa automática — ${COVER_SLUG}"
          # Outra conversa/automação pode atualizar main enquanto a foto é
          # baixada. Rebaseia o commit único da capa antes de enviar, evitando
          # perder a imagem por um non-fast-forward transitório.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Espera o deploy publicar o asset
        if: steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
        run: |
          url="https://veronicahub.com/images/blog-covers/${COVER_SLUG}.jpg"
          for _ in $(seq 1 8); do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" "$url")
            if [ "$status" = "200" ]; then
              echo "Asset já está no ar ($url)."
              break
            fi
            echo "Ainda não ($status) — aguardando o deploy..."
            sleep 10
          done

      - name: Seta coverImageUrl da matéria
        if: steps.commit.outcome == 'success'
        env:
          COVER_SLUG: ${{ steps.generate.outputs.slug }}
          PHOTO_ID: ${{ steps.fetch_photo.outputs.photoId }}
          PHOTO_CREDIT: ${{ steps.fetch_photo.outputs.photoCredit }}
          PHOTO_URL: ${{ steps.fetch_photo.outputs.photoUrl }}
        run: |
          url="https://veronicahub.com/images/blog-covers/${COVER_SLUG}.jpg"
          body=$(jq -n \
            --arg slug "$COVER_SLUG" \
            --arg url "$url" \
            --arg photoId "$PHOTO_ID" \
            --arg photoCredit "$PHOTO_CREDIT" \
            --arg photoUrl "$PHOTO_URL" \
            '{slug: $slug, coverImageUrl: $url, photoId: $photoId, photoCredit: $photoCredit, photoUrl: $photoUrl}')
          status=$(curl --silent --show-error \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            -o set-cover-response.json -w "%{http_code}" \
            -X POST "https://veronicahub.com/api/cron/set-cover-image" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$body")
          echo "HTTP status: $status"
          cat set-cover-response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

      - name: Sincroniza capas publicadas com a biblioteca Admin
        if: steps.generate.outputs.generated == 'true'
        continue-on-error: true
        run: |
          status=$(curl --silent --show-error \
            --max-time 120 \
            --retry 2 \
            --retry-all-errors \
            -o library-response.json -w "%{http_code}" \
            -X POST "https://veronicahub.com/api/cron/backfill-wire-covers" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat library-response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
