name: Gera e publica matéria (Veronica Wire)

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Chama o endpoint de geração automática
        run: |
          status=$(curl --silent --show-error \
            --max-time 120 \
            -o response.json -w "%{http_code}" \
            -X POST "https://veronicahub.com/api/cron/generate-article" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat response.json
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
