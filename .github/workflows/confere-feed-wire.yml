name: Confere o feed do Wire no ar

# Pergunta ao site publicado se as rotas públicas do feed respondem, e se o
# que volta obedece ao contrato. Roda sob demanda (depois de um deploy) e uma
# vez por dia, porque um feed que alguém consome de fora quebra em silêncio:
# quem percebe primeiro é o leitor, não nós.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pede o feed
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 30 \
            -o feed.json -D cabecalhos.txt -w "%{http_code}" \
            "https://veronicahub.com/api/wire/feed.json")
          echo "HTTP $status"
          grep -iE '^(content-type|access-control-allow-origin|cache-control):' cabecalhos.txt
          if [ "$status" != "200" ]; then
            echo "::error::O feed não respondeu 200."
            head -c 600 feed.json
            exit 1
          fi

      - name: Confere o contrato do feed
        run: |
          set -euo pipefail
          grep -qi '^access-control-allow-origin: \*' cabecalhos.txt || {
            echo "::error::Sem CORS liberado — o leitor de fora não consegue ler."
            exit 1
          }
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const feed = JSON.parse(readFileSync("feed.json", "utf8"));

          const CAMPOS = ["id", "slug", "titulo", "resumo", "corpoHtml", "editoria",
            "capaUrl", "capaCredito", "fontes", "publicadoEm", "urlOriginal"];

          if (!feed.atualizadoEm) throw new Error("atualizadoEm ausente");
          if (!("briefing" in feed)) throw new Error("briefing ausente");
          if (!Array.isArray(feed.materias)) throw new Error("materias não é uma lista");
          if (feed.materias.length === 0) throw new Error("o feed veio sem nenhuma matéria");

          for (const materia of feed.materias) {
            const faltando = CAMPOS.filter((campo) => !(campo in materia));
            if (faltando.length) throw new Error(`${materia.slug}: falta ${faltando.join(", ")}`);
            const sobrando = Object.keys(materia).filter((campo) => !CAMPOS.includes(campo));
            if (sobrando.length) throw new Error(`${materia.slug}: campo interno vazou — ${sobrando.join(", ")}`);
          }

          console.log(`materias: ${feed.materias.length}`);
          console.log(`atualizadoEm: ${feed.atualizadoEm}`);
          console.log(`briefing: ${JSON.stringify(feed.briefing)}`);
          console.log("primeira matéria:");
          console.log(JSON.stringify(feed.materias[0], null, 2).slice(0, 900));
          JS

      - name: Pede uma matéria pelo slug
        run: |
          set -euo pipefail
          slug=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("feed.json","utf8")).materias[0].slug)')
          status=$(curl --silent --show-error --max-time 30 \
            -o materia.json -w "%{http_code}" \
            "https://veronicahub.com/api/wire/materia/${slug}.json")
          echo "HTTP $status — /api/wire/materia/${slug}.json"
          if [ "$status" != "200" ]; then
            echo "::error::A rota da matéria não respondeu 200."
            head -c 600 materia.json
            exit 1
          fi
          node -e '
            const m = JSON.parse(require("fs").readFileSync("materia.json","utf8"));
            if (!m.slug || !m.titulo) throw new Error("matéria sem slug ou título");
            console.log(`${m.editoria} — ${m.titulo}`);
          '

      - name: Pede o feed no padrão JSON Feed
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 30 \
            -o jsonfeed.json -D cabecalhos-jsonfeed.txt -w "%{http_code}" \
            "https://veronicahub.com/api/wire/jsonfeed.json")
          echo "HTTP $status"
          grep -iE '^(content-type|access-control-allow-origin):' cabecalhos-jsonfeed.txt
          if [ "$status" != "200" ]; then
            echo "::error::O JSON Feed não respondeu 200."
            head -c 600 jsonfeed.json
            exit 1
          fi
          node -e '
            const f = JSON.parse(require("fs").readFileSync("jsonfeed.json","utf8"));
            if (!String(f.version).startsWith("https://jsonfeed.org/version/1")) {
              throw new Error("version fora do padrão");
            }
            if (!Array.isArray(f.items) || f.items.length === 0) throw new Error("items vazio");
            const i = f.items[0];
            for (const campo of ["id", "url", "title", "content_html", "tags"]) {
              if (!(campo in i)) throw new Error(`item sem ${campo}`);
            }
            console.log(`items: ${f.items.length}`);
            console.log(`primeiro: [${i.tags.join(", ")}] ${i.title}`);
          '

      # O curl acima é um servidor pedindo. Um navegador pede diferente: manda
      # Origin, e antes disso pode mandar um pré-voo OPTIONS. É esse caminho
      # que decide se um leitor hospedado em outro domínio consegue ler.
      - name: Confere o CORS como um navegador faria
        run: |
          set -euo pipefail
          origem="https://leitor-externo.example"
          alvo="https://veronicahub.com/api/wire/jsonfeed.json"

          echo "--- pré-voo OPTIONS"
          curl --silent --show-error --max-time 30 -o /dev/null -D preflight.txt \
            -X OPTIONS -H "Origin: $origem" -H "Access-Control-Request-Method: GET" "$alvo"
          head -1 preflight.txt
          grep -iE '^access-control-allow-(origin|methods|headers):' preflight.txt

          echo "--- GET com Origin, como o app faz"
          status=$(curl --silent --show-error --max-time 30 \
            -o navegador.json -D navegador.txt -w "%{http_code}" \
            -H "Origin: $origem" -H "Accept: application/json" "$alvo")
          echo "HTTP $status"
          grep -iE '^(content-type|access-control-allow-origin|server|cf-cache-status|www-authenticate|set-cookie):' navegador.txt || true

          grep -qi '^access-control-allow-origin: \*' navegador.txt || {
            echo "::error::Sem CORS na resposta com Origin — aí sim seria o nosso lado."
            exit 1
          }
          if grep -qi '^www-authenticate:' navegador.txt; then
            echo "::error::A rota está pedindo autenticação."
            exit 1
          fi

          node -e '
            const f = JSON.parse(require("fs").readFileSync("navegador.json","utf8"));
            console.log(`version: ${f.version}`);
            console.log(`title:   ${f.title}`);
            console.log(`items:   ${f.items.length}`);
            const quebrados = f.items.filter(
              (i) => !i.id || !i.title || !i.content_html || !i.content_text
            );
            if (quebrados.length) throw new Error(`${quebrados.length} itens incompletos`);
            const forasteiros = new Set();
            const PADRAO = ["id","url","external_url","title","content_html","content_text",
              "summary","image","banner_image","date_published","date_modified",
              "authors","author","tags","language","attachments"];
            for (const i of f.items) {
              for (const campo of Object.keys(i)) {
                if (!PADRAO.includes(campo) && !campo.startsWith("_")) forasteiros.add(campo);
              }
            }
            if (forasteiros.size) throw new Error(`fora do padrão sem underscore: ${[...forasteiros]}`);
            console.log("todos os itens têm id, title, content_html e content_text");
            console.log("nenhum campo fora do padrão sem underscore");
          '
