name: Agente Members · comunidade
on:
  schedule:
    - cron: "23 */4 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/members-agent.yml"]
  workflow_dispatch:
concurrency:
  group: members-community-agent
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Executa editorial e acolhimento da comunidade
        env:
          MEMBERS_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # O primeiro push valida o runtime somente quando o deploy estiver disponível.
          if [ "${{ github.event_name }}" = "push" ]; then
            ready=false
            for attempt in $(seq 1 18); do
              if curl --silent --show-error --max-time 10 --fail "https://veronicahub.com/api/agents/members/status" -o status.json && jq -e '.version == "1.0.1"' status.json >/dev/null; then ready=true; break; fi
              sleep 10
            done
            if [ "$ready" != "true" ]; then echo "::error::Deploy Members indisponível."; exit 1; fi
          fi
          status=$(curl --silent --show-error --max-time 150 -o response.json -w "%{http_code}" -X POST "https://veronicahub.com/api/cron/members-agent" -H "Authorization: Bearer $MEMBERS_CRON_SECRET")
          cat response.json
          cat response.json >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::O agente Members precisa de supervisão (HTTP $status)."
            exit 1
          fi
