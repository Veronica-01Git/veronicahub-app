name: Sincroniza acervo Wire (execução única)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wire-backfill-once.yml"

permissions:
  contents: read

jobs:
  backfill:
    # Segunda execução: origem direta do arquivo, sem chamada circular ao Worker.
    runs-on: ubuntu-latest
    steps:
      - name: Copia capas publicadas para a biblioteca Admin
        run: |
          status=$(curl --silent --show-error \
            --max-time 180 \
            --retry 2 \
            --retry-all-errors \
            -o response.json -w "%{http_code}" \
            -X POST "https://veronicahub.com/api/cron/backfill-wire-covers" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Falha HTTP: $status"
            exit 1
          fi
