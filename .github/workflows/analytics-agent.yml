name: Agente Analytics · curadoria
on:
  schedule:
    - cron: "41 * * * *"
  push:
    branches: [main]
    paths: [".github/workflows/analytics-agent.yml"]
  workflow_dispatch:
concurrency:
  group: analytics-commerce-agent
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confere catálogo e publica sugestões rastreáveis
        env:
          ANALYTICS_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ANALYTICS_CRON_SECRET" ]; then echo "::error::Credencial de execução indisponível."; exit 1; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            ready=false
            for attempt in $(seq 1 24); do
              if curl --silent --show-error --max-time 10 --fail "https://veronicahub.com/api/agents/analytics/status" -o status.json && jq -e '.version == "1.0.2"' status.json >/dev/null; then ready=true; break; fi
              sleep 10
            done
            if [ "$ready" != "true" ]; then echo "::error::Deploy Analytics indisponível."; exit 1; fi
          fi
          status=$(curl --silent --show-error --max-time 70 -o response.json -w "%{http_code}" -X POST "https://veronicahub.com/api/cron/analytics-agent" -H "Authorization: Bearer $ANALYTICS_CRON_SECRET")
          cat response.json
          cat response.json >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then echo "::error::O agente Analytics precisa de supervisão (HTTP $status)."; exit 1; fi
