name: Banco de Shorts · inicialização
on:
  push:
    branches: [main]
    paths: [".github/workflows/social-shorts-init.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: social-shorts-init
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Aguarda o painel e inicializa o banco sem publicar nas redes
        env:
          SOCIAL_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SOCIAL_CRON_SECRET" ]; then echo "::error::Credencial de execução indisponível."; exit 1; fi
          ready=false
          for attempt in $(seq 1 24); do
            if curl --silent --show-error --max-time 10 --fail "https://veronicahub.com/api/agents/social-shorts/status" -o status.json && jq -e '.version == "1.0.0"' status.json >/dev/null; then ready=true; break; fi
            sleep 10
          done
          if [ "$ready" != "true" ]; then echo "::error::Deploy do banco de shorts indisponível."; exit 1; fi
          # The authenticated preparation endpoint creates only the three Social tables.
          # With an empty source bank this does not call a model or publish anything.
          curl --silent --show-error --max-time 60 --fail-with-body -X POST "https://veronicahub.com/api/cron/social-shorts" -H "Authorization: Bearer $SOCIAL_CRON_SECRET" -o response.json
          curl --silent --show-error --max-time 15 --fail "https://veronicahub.com/api/agents/social-shorts/status" -o status.json
          jq -e '.version == "1.0.0" and .counts != null and .scheduleActive == false and .publishingActive == false' status.json >/dev/null
          echo "Banco inicializado. Frequência, edição e publicação externas permanecem inativas." >> "$GITHUB_STEP_SUMMARY"
