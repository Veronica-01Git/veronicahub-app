name: Validate Veronica Universe

on:
  pull_request:
    paths:
      - "src/components/universe/**"
      - "src/routes/admin/**"
      - "src/lib/admin-server.ts"
      - "src/lib/admin-core.server.ts"
      - "src/lib/veronica-universe-access.ts"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/validate-universe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
