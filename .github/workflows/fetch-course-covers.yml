name: Busca capas das formações (Pexels/Pixabay)

# Manual só — não faz parte de nenhum cron. Roda uma vez (ou de novo, se
# quiser trocar as fotos) pra popular public/images/formacoes/<slug>.jpg,
# as capas dos cards de /comandos e do teaser da home.
#
# Commita na branch em que o workflow foi disparado, não sempre na main:
# assim dá pra rodar numa branch de trabalho, conferir as fotos e só depois
# abrir o PR.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Slugs separados por espaço (vazio = todas as 11). Ex: meta-ads"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Busca uma foto por formação (Pexels/Pixabay)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Via env, não interpolado direto no run: entrada de workflow_dispatch
          # colada no texto do comando é injeção de shell. Sem aspas no uso
          # porque queremos o split por espaço; o script valida cada slug
          # contra a lista conhecida e aborta no que não reconhecer.
          SLUGS: ${{ inputs.slugs }}
        run: node scripts/fetch-course-covers.mjs $SLUGS

      - name: Commita as capas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/formacoes/
          git diff --cached --quiet && echo "Nada novo pra commitar." && exit 0
          git commit -m "chore(formacoes): atualiza capas das formações"
          git push
