name: Abastece o banco de capas (Wire TV)

# Enche o banco curado de capas da biblioteca do Admin com fotografias do
# Pexels, para a Wire TV publicar foto de verdade em vez da arte gerada do
# slug (que é o piso, não o teto — ver scripts/render-cover-art.mjs).
#
# NÃO commita nada e NÃO dispara deploy: o script fala com o endpoint
# /api/cron/cover-bank do site, protegido pelo CRON_SECRET, e quem grava é o
# banco. É a diferença deste workflow para o do cron editorial, que commita
# capa no main e por isso publica a cada rodada.
#
# Semanal porque o banco é reaproveitado: pickLibraryCover faz rodízio
# evitando as últimas 40 capas usadas, então 8 fotos por editoria já giram
# bastante. O teto por editoria mora no servidor (MAX_BANK_PER_BEAT), não
# aqui — o endpoint recusa o que passar disso, mesmo que este workflow rode
# duas vezes.
on:
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só listar o que seria cadastrado, sem gravar"
        type: boolean
        default: false
      target_per_beat:
        description: "Quantas fotos por editoria o banco deve ter"
        type: string
        default: "8"

permissions:
  contents: read

concurrency:
  group: wire-cover-bank
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Busca no Pexels e cadastra na biblioteca
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BANK_TARGET_PER_BEAT: ${{ inputs.target_per_beat || '8' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/fill-cover-bank.mjs --dry-run | tee bank.log
          else
            node scripts/fill-cover-bank.mjs | tee bank.log
          fi

      - name: Resumo da rodada
        if: always()
        run: |
          {
            echo "### Banco de capas da Wire TV"
            echo
            echo '```'
            cat bank.log 2>/dev/null || echo "sem saída"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
