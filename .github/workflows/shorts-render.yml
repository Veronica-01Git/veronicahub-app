name: Veronica Shorts · processador
# Processa a fila do painel /admin/shorts: download autorizado, transcrição,
# seleção, renderização 1080×1920 e envio dos MP4s ao R2. Não publica nada nas
# redes; a cadência de postagem é outra integração e segue desligada.
# Repositório público: minutos do Actions são gratuitos e os LOGS SÃO PÚBLICOS —
# nada de transcrição, URL de mídia ou credencial é impresso (segredos são mascarados).
on:
  workflow_dispatch: {}
  # Só consulta a fila; sem trabalho, encerra em segundos sem instalar nada.
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
concurrency:
  group: shorts-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HUB_BASE_URL: https://veronicahub.com
      SOCIAL_RENDER_SECRET: ${{ secrets.SOCIAL_RENDER_SECRET }}
      SHORTS_S3_ENDPOINT: ${{ secrets.SHORTS_S3_ENDPOINT }}
      SHORTS_S3_ACCESS_KEY_ID: ${{ secrets.SHORTS_S3_ACCESS_KEY_ID }}
      SHORTS_S3_SECRET_ACCESS_KEY: ${{ secrets.SHORTS_S3_SECRET_ACCESS_KEY }}
      SHORTS_S3_BUCKET: veronicahub-shorts
      SHORTS_S3_PREFIX: shorts
      # Bucket privado (sem domínio público) para o arquivo original enviado pela operadora.
      SHORTS_SOURCE_BUCKET: veronicahub-shorts-sources
      WHISPER_MODEL: small
    steps:
      - name: Confere configuração e fila
        id: pending
        run: |
          missing=""
          for name in SOCIAL_RENDER_SECRET SHORTS_S3_ENDPOINT SHORTS_S3_ACCESS_KEY_ID SHORTS_S3_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "Processador ainda não configurado; nada a fazer." >> "$GITHUB_STEP_SUMMARY"
              echo "work=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Segredos ausentes em Settings → Secrets and variables → Actions:$missing"; exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 -o pending.json -w "%{http_code}" -X POST \
            "$HUB_BASE_URL/api/social/render/pending" -H "Authorization: Bearer $SOCIAL_RENDER_SECRET" \
            -H "Content-Type: application/json" -d '{}') || status=000
          if [ "$status" != "200" ]; then
            echo "::error::A Hub recusou a consulta da fila (HTTP $status). Confira se SOCIAL_RENDER_SECRET é igual no GitHub e no Worker veronicahub-app."; exit 1
          fi
          queued=$(jq -r '.queued // 0' pending.json); running=$(jq -r '.running // 0' pending.json)
          echo "Fila: $queued aguardando, $running em andamento." >> "$GITHUB_STEP_SUMMARY"
          if [ "$queued" -gt 0 ]; then echo "work=true" >> "$GITHUB_OUTPUT"; else echo "work=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.pending.outputs.work == 'true'
        with:
          sparse-checkout: workers/shorts-engine

      - name: Instala FFmpeg
        if: steps.pending.outputs.work == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core > /dev/null
          ffmpeg -hide_banner -version | head -1

      - uses: actions/setup-python@v5
        if: steps.pending.outputs.work == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/shorts-engine/requirements.txt

      - name: Instala dependências fixadas
        if: steps.pending.outputs.work == 'true'
        run: pip install --quiet -r workers/shorts-engine/requirements.txt

      - name: Cache do modelo de transcrição
        if: steps.pending.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-v1

      - name: Processa a fila
        if: steps.pending.outputs.work == 'true'
        working-directory: workers/shorts-engine
        run: python worker.py --drain

      - name: Resumo
        if: always() && steps.pending.outputs.work == 'true'
        run: echo "Etapas e prévias de cada trabalho ficam em https://veronicahub.com/admin/shorts." >> "$GITHUB_STEP_SUMMARY"
